<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>channel 404 broken intro</title>
<style>body{background:#000;color:#0f0;font-family:monospace;text-align:center;padding:50px;}</style>
</head>
<body>
<h1>channel 404 be like</h1>
<button onclick="playGlitch()" style="font-size:2em;padding:20px;background:#0f0;color:#000;border:none;cursor:pointer;">PLAY THE CURSE</button>

<script>
const ctx = new (window.AudioContext || window.webkitAudioContext)();

function note(freq, dur = 0.15, vol = 0.4) {
  if (!freq) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = freq;
  osc.type = 'sawtooth'; // crunchy glitch energy
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.start();
  osc.stop(ctx.currentTime + dur + 0.05);
}

const notes = [261.63, 329.63, 98.00, 392.00, 32.70, 523.25, 16.35, 1046.50, 8.18]; // c4 e4 g2 g4 c1 c5 c0 c6 c-1 approx
const vels   = [0.8, 1.0, 0.4, 0.9, 0.3, 1.0, 0.1, 0.7, 0.05];

function playGlitch() {
  let time = ctx.currentTime + 0.05;
  notes.forEach((freq, i) => {
    setTimeout(() => {
      note(freq, 0.18, vels[i]);
      // tiny random echo for extra broken
      if (Math.random() > 0.6) setTimeout(() => note(freq*1.02, 0.08, vels[i]*0.3), 40 + Math.random()*80);
    }, (time - ctx.currentTime) * 1000);
    time += 0.22 + Math.random()*0.08; // off-beat chaos
  });
}
</script>
</body>
</html>
