<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>channel 404 broken intro - now downloadable</title>
<style>body{background:#000;color:#0f0;font-family:monospace;text-align:center;padding:50px;}</style>
</head>
<body>
<h1>channel 404 be like</h1>
<button onclick="playAndRecord()" style="font-size:2em;padding:20px;background:#0f0;color:#000;border:none;cursor:pointer;margin:10px;">PLAY + RECORD CURSE</button>
<a id="downloadLink" style="display:none;font-size:1.5em;color:#f0f;">↓ download ur crime (webm, rename to mp3 if u dare)</a>

<script>
const ctx = new (window.AudioContext || window.webkitAudioContext)();
let mediaRecorder;
let recordedChunks = [];

function note(freq, dur = 0.15, vol = 0.4) {
  if (!freq) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = freq;
  osc.type = 'sawtooth';
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.start();
  osc.stop(ctx.currentTime + dur + 0.05);
}

const notes = [261.63, 329.63, 98.00, 392.00, 32.70, 523.25, 16.35, 1046.50, 8.18];
const vels   = [0.8, 1.0, 0.4, 0.9, 0.3, 1.0, 0.1, 0.7, 0.05];

async function playAndRecord() {
  recordedChunks = [];
  const dest = ctx.createMediaStreamDestination();
  const output = ctx.createGain();
  output.connect(ctx.destination); // hear it
  output.connect(dest); // record it

  // temp gain for recording chain
  const recGain = ctx.createGain();
  recGain.gain.value = 1;
  output.connect(recGain);
  recGain.connect(dest);

  if (!navigator.mediaDevices || !MediaRecorder) {
    alert("ur browser hates fun, no recording 4 u");
    return;
  }

  const stream = dest.stream;
  mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
    const url = URL.createObjectURL(blob);
    const link = document.getElementById('downloadLink');
    link.href = url;
    link.download = 'channel404_glitch.webm'; // rename to .mp3 later if u want chaos
    link.style.display = 'block';
    link.click(); // auto trigger or just click it urself lazy
  };

  mediaRecorder.start();

  let time = ctx.currentTime + 0.1;
  notes.forEach((freq, i) => {
    setTimeout(() => {
      note(freq, 0.18, vels[i]);
      if (Math.random() > 0.6) setTimeout(() => note(freq*1.02, 0.08, vels[i]*0.3), 40 + Math.random()*80);
    }, (time - ctx.currentTime) * 1000);
    time += 0.22 + Math.random()*0.08;
  });

  // stop recording after ~3-4 sec (whole sequence)
  setTimeout(() => {
    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
  }, 4000);
}
</script>
</body>
</html>
